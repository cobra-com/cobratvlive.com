<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بروفايل المستخدم - COBRA TV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0d0d0e; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 24px; padding: 32px 24px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 2px solid #ff0055; margin-bottom: 16px; }
        .name { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
        .username { color: #ff0055; font-size: 14px; margin-bottom: 12px; }
        .bio { font-size: 13px; color: #a1a1aa; line-height: 1.5; margin-bottom: 24px; }
        .stats { display: flex; justify-content: space-around; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 16px; margin-bottom: 24px; }
        .stat-item { display: flex; flex-direction: column; }
        .stat-value { font-weight: bold; font-size: 16px; }
        .stat-label { font-size: 11px; color: #a1a1aa; margin-top: 2px; }
        .btn { display: block; width: 100%; padding: 14px; background: #ff0055; color: white; text-decoration: none; font-weight: bold; border-radius: 50px; transition: 0.3s; }
        .btn:hover { background: #e0004c; transform: translateY(-2px); }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #ff0055; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <!-- Firebase Web SDK CDN (v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // 🔥 بيانات مشروعك الحقيقية
        const firebaseConfig = {
            apiKey: "AIzaSyCZzSbLegFJ_xaVVqtFWFUCu2WFOd42cF0",
            authDomain: "cobra-tv-b1231.firebaseapp.com",
            projectId: "cobra-tv-b1231",
            storageBucket: "cobra-tv-b1231.firebasestorage.app",
            messagingSenderId: "73044924945",
            appId: "1:73044924945:web:4ed40ee2b6463b574e2fb0",
            measurementId: "G-X5JQH06QNK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchUserProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const userQuery = urlParams.get('u');

            if (!userQuery) {
                showError("الرابط غير صحيح أو لا يحتوي على معرف");
                return;
            }

            try {
                let userData = null;

                // 1. تجربة جلب المستند بـ UID مباشر
                const docRef = doc(db, "users", userQuery);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    userData = docSnap.data();
                } else {
                    // 2. تجربة جلب المستند بالبحث عن حقل الـ username
                    const q = query(collection(db, "users"), where("username", "==", userQuery));
                    const querySnapshot = await getDocs(q);
                    if (!querySnapshot.empty) {
                        userData = querySnapshot.docs[0].data();
                    }
                }

                if (userData) {
                    renderUserData(userData, userQuery);
                } else {
                    showError("المستخدم غير موجود");
                }
            } catch (error) {
                console.error("Firebase Error:", error);
                showError("حدث خطأ أثناء تحميل البيانات من الفايربيز");
            }
        }

        function renderUserData(data, userId) {
            document.getElementById("loader").style.display = "none";
            document.getElementById("content").style.display = "block";

            // جلب الاسم والصورة والملاحظات بحسب الحقول الموجودة لديك في Firestore
            document.getElementById("displayName").innerText = data.name || data.displayName || userId;
            document.getElementById("username").innerText = "@" + (data.username || "user");
            document.getElementById("bio").innerText = data.bio || "مرحباً بك في بروفايلي على COBRA TV 🚀";
            
            // الصورة الشخصية
            if (data.photoUrl || data.avatarUrl) {
                document.getElementById("avatar").src = data.photoUrl || data.avatarUrl;
            }

            // العدادات
            document.getElementById("followersCount").innerText = data.followersCount || 0;
            document.getElementById("followingCount").innerText = data.followingCount || 0;
            document.getElementById("likesCount").innerText = data.likesCount || 0;

            // رابط فتح التطبيق
            document.getElementById("openAppBtn").href = `cobratv://user?uid=${data.uid || userId}`;
        }

        function showError(msg) {
            document.getElementById("loader").style.display = "none";
            document.getElementById("content").style.display = "block";
            document.getElementById("displayName").innerText = msg;
            document.getElementById("username").innerText = "";
            document.getElementById("bio").innerText = "";
        }

        window.onload = fetchUserProfile;
    </script>
</head>
<body>

    <div class="card">
        <div id="loader" class="loader"></div>

        <div id="content" style="display: none;">
            <img id="avatar" class="avatar" src="https://res.cloudinary.com/mfkqydlq/image/upload/v1788100322/user_avatar_1788100316121.png" alt="Avatar">

            <h2 id="displayName" class="name">--</h2>
            <p id="username" class="username">--</p>
            <p id="bio" class="bio">--</p>

            <div class="stats">
                <div class="stat-item">
                    <span id="followersCount" class="stat-value">0</span>
                    <span class="stat-label">متابع</span>
                </div>
                <div class="stat-item">
                    <span id="followingCount" class="stat-value">0</span>
                    <span class="stat-label">يتابع</span>
                </div>
                <div class="stat-item">
                    <span id="likesCount" class="stat-value">0</span>
                    <span class="stat-label">إعجاب</span>
                </div>
            </div>

            <a id="openAppBtn" href="#" class="btn">فتح في تطبيق COBRA TV</a>
        </div>
    </div>

</body>
</html>
